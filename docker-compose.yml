version: '3.8'

services:
  redis-db:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  flask-app:
    build:
      context: .
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis-db
    depends_on:
      - redis-db
    command: python api.py

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_HOST=redis-db
    depends_on:
      - redis-db
    command: python worker.py

volumes:
  redis_data:
