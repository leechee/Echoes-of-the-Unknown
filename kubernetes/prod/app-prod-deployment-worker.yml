apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: leechee1/worker:latest
          env:
            - name: REDIS_HOST
              value: "redis-prod"
